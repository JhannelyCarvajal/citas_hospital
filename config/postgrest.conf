# =====================================================================
# Configuracion de PostgREST para Hospital_Prototipo_Citas
# =====================================================================

# Conexion a la base de datos
db-uri = "postgres://postgres:1@localhost:5432/bd_hospital"

# Esquema a exponer
db-schemas = "public"

# Rol de la base de datos para las peticiones anonimas
db-anon-role = "anon"

# Puerto del servidor
server-port = 3000

# Host del servidor
server-host = "0.0.0.0"

# Maximo de filas por respuesta
max-rows = 1000

# Habilitar CORS
# server-cors-allowed-origins = "*"

# Configuracion de JWT (opcional)
# jwt-secret = "tu-secreto-jwt-aqui"
# jwt-role-claim-key = "role"

# Log de consultas
# log-level = "info"

# Tiempo de vida del pool de conexiones
# db-pool-acquisition-timeout = 10
# db-pool-max-lifetime = 1800
# db-pool-max-idle-time = 600